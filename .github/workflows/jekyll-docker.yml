name: jekyll-docker

on:
  push:
    branches: [main, master]
    paths:
      - "md/**"
      - "img/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: gen-html-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cài marked rồi gen HTML mọi bài
        env:
          NODE_PATH: /tmp/mdbuild/node_modules
        run: |
          set -eu
          echo "workspace=$GITHUB_WORKSPACE"
          pwd
          ls -la
          ls -la scripts || true
          ls -la md || true
          SCRIPT="$GITHUB_WORKSPACE/scripts/build-posts.cjs"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Thiếu $SCRIPT — hãy commit file scripts/build-posts.cjs rồi Run workflow lại."
            find "$GITHUB_WORKSPACE" -name 'build-posts*' -o -name '*.cjs' | head
            exit 1
          fi
          mkdir -p /tmp/mdbuild
          npm install --prefix /tmp/mdbuild marked@15.0.12
          node "$SCRIPT"

      - name: Commit HTML đã gen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bai index.html posts.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi HTML."
            exit 0
          fi
          git commit -m "chore: gen lại HTML từ markdown"
          git push